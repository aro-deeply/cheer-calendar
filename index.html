<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EFE9FF">
<title>화이팅 달력</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Gaegu:wght@700&family=Gothic+A1:wght@400;600;800&display=swap">
<style>
/* Layout: diary-sticker page. Lavender dot-grid paper, thick ink outlines, hard offset shadows; the cheer card takes each month's candy color. Single deliberate light look. */
:root {
  --paper: #EFE9FF;
  --dot: rgba(27, 21, 48, .13);
  --ink: #1B1530;
  --sub: #6A5F86;
  --white: #FFFFFF;
  --note: #FFFDF6;
  --pink: #FF4FA3;
  --pink-text: #E8338A;
  --lime: #C8F23C;
  --butter: #FFE45C;
  --butter-soft: #FFF4B8;
  --blue: #2B8FD6;
  --rule: rgba(43, 143, 214, .28);
  --card: #FFC9A8;
  --font-display: "Bagel Fat One", "Gothic A1", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --font-hand: "Gaegu", "Gothic A1", "Apple SD Gothic Neo", sans-serif;
  --font-body: "Gothic A1", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body {
  margin: 0;
  background-color: var(--paper);
  background-image: radial-gradient(var(--dot) 1.2px, transparent 1.3px);
  background-size: 18px 18px;
  color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.5;
  word-break: keep-all; -webkit-tap-highlight-color: transparent;
}
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--pink); outline-offset: 3px; }

.app {
  max-width: 460px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 18px 32px;
  display: flex; flex-direction: column; gap: 18px;
}

/* chunky controls */
.chunk {
  border: 2px solid var(--ink); background: var(--white); color: var(--ink);
  box-shadow: 3px 3px 0 var(--ink); transition: transform .08s, box-shadow .08s;
}
.chunk:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink); }

/* header */
.top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.logo {
  font-family: var(--font-display); font-size: 15px; background: var(--lime);
  border: 2px solid var(--ink); border-radius: 999px; padding: 5px 13px 4px;
  transform: rotate(-4deg); box-shadow: 2px 2px 0 var(--ink); white-space: nowrap;
}
.actions { display: flex; gap: 8px; }
.pill {
  height: 40px; padding: 0 15px; border-radius: 999px;
  font-weight: 800; font-size: 14px; white-space: nowrap;
  display: inline-flex; align-items: center; gap: 5px;
}
.pill.yellow { background: var(--butter); }

.month { display: flex; align-items: flex-end; justify-content: space-between; gap: 8px; }
.month-title { display: flex; align-items: flex-end; gap: 6px; }
.big {
  font-family: var(--font-display); font-size: 92px; line-height: .82; color: var(--pink);
  -webkit-text-stroke: 2.5px var(--ink); text-shadow: 5px 5px 0 var(--ink);
  font-variant-numeric: tabular-nums;
}
.big.pop { animation: bigpop .45s cubic-bezier(.3,1.6,.5,1); }
@keyframes bigpop { from { transform: scale(.6) rotate(-8deg); } to { transform: none; } }
.month-sub { display: flex; flex-direction: column; gap: 4px; padding-bottom: 4px; }
.month-sub .yr { font-weight: 800; font-size: 13px; letter-spacing: .08em; font-variant-numeric: tabular-nums; }
.month-sub .wol { font-family: var(--font-display); font-size: 30px; line-height: 1; }
.nav { display: flex; gap: 8px; padding-bottom: 6px; }
.round { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; }

/* cheer card */
.stage {
  position: relative; border: 2.5px solid var(--ink); border-radius: 30px;
  background-color: var(--card);
  background-image: radial-gradient(rgba(255,255,255,.55) 1.6px, transparent 1.7px);
  background-size: 16px 16px;
  box-shadow: 6px 6px 0 var(--ink);
  padding: 22px 16px 16px; display: flex; flex-direction: column; gap: 14px;
  transition: background-color .4s ease;
}
.tape {
  position: absolute; top: -13px; left: 50%; width: 104px; height: 26px; margin-left: -52px;
  transform: rotate(-4deg); z-index: 3; pointer-events: none;
  background: repeating-linear-gradient(45deg, rgba(255,228,92,.88) 0 8px, rgba(255,255,255,.78) 8px 16px);
  border-left: 2px dashed rgba(27,21,48,.25); border-right: 2px dashed rgba(27,21,48,.25);
}
.sky { position: absolute; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; border-radius: 28px; container-type: size; }
.stage > *:not(.sky):not(.tape) { position: relative; z-index: 1; }
.tags { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.tag-dark { background: var(--ink); color: var(--white); border-radius: 999px; padding: 4px 11px; font-size: 12px; font-weight: 800; letter-spacing: .04em; }
.tag-light { background: var(--white); border: 2px solid var(--ink); border-radius: 999px; padding: 2px 10px; font-size: 12px; font-weight: 800; }
.cheer { display: grid; grid-template-columns: 158px minmax(0, 1fr); gap: 10px; align-items: center; }
.char-btn { position: relative; border: 0; background: none; padding: 34px 0 0; display: block; width: 100%; border-radius: 20px; }
.sticker {
  display: block;
  filter: drop-shadow(3px 0 0 #fff) drop-shadow(-3px 0 0 #fff) drop-shadow(0 3px 0 #fff) drop-shadow(0 -3px 0 #fff) drop-shadow(3px 4px 0 rgba(27,21,48,.85));
}
.sticker svg { display: block; width: 100%; height: auto; overflow: visible; }
.shout {
  position: absolute; top: -8px; left: -10px; width: 104px; height: 104px; z-index: 2;
  transform: rotate(-12deg); pointer-events: none;
}
.shout svg { width: 100%; height: 100%; display: block; }
.shout span {
  position: absolute; inset: 0; display: grid; place-items: center; text-align: center;
  font-family: var(--font-display); font-size: 19px; line-height: 1.05; color: var(--ink); padding: 0 14px;
}
.shout.pop { animation: pop .55s cubic-bezier(.3,1.6,.5,1); }
@keyframes pop {
  0% { transform: rotate(-40deg) scale(.2); opacity: 0; }
  100% { transform: rotate(-12deg) scale(1); opacity: 1; }
}
.say { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.bubble {
  background: var(--white); border: 2.5px solid var(--ink); border-radius: 22px;
  box-shadow: 3px 3px 0 var(--ink); padding: 13px 14px;
  font-family: var(--font-hand); font-weight: 700; font-size: 21px; line-height: 1.32;
  min-height: 84px; display: flex; align-items: center;
}
.bubble.fade { animation: fadein .35s ease; }
@keyframes fadein { from { opacity: 0; transform: translateY(5px) rotate(1deg); } to { opacity: 1; transform: none; } }
.link-btn {
  align-self: flex-start; border: 0; background: var(--white); border-radius: 999px; padding: 3px 10px;
  font-weight: 800; font-size: 13px; color: var(--pink-text); box-shadow: 0 0 0 2px var(--ink);
}
.more {
  height: 54px; width: 100%; border: 2.5px solid var(--ink); border-radius: 999px;
  background: var(--pink); color: var(--white); box-shadow: 4px 4px 0 var(--ink);
  font-family: var(--font-display); font-size: 19px; letter-spacing: .02em;
  transition: transform .08s, box-shadow .08s;
}
.more:active { transform: translate(3px, 3px); box-shadow: 1px 1px 0 var(--ink); }
.goal {
  display: flex; align-items: center; gap: 8px; background: var(--white);
  border: 2px dashed var(--ink); border-radius: 16px; padding: 5px 6px;
}
.goal label {
  flex: none; background: var(--butter); border: 2px solid var(--ink); border-radius: 10px;
  padding: 4px 9px; font-size: 12.5px; font-weight: 800; transform: rotate(-2deg);
}
.goal input { flex: 1; min-width: 0; border: 0; background: transparent; height: 36px; font-size: 15px; font-weight: 600; }
.goal input::placeholder { color: var(--sub); font-weight: 400; }
.goal input:focus { outline: none; }
.goal:focus-within { border-style: solid; }

/* character motion */
.bob { animation: bob 1.6s ease-in-out infinite; transform-box: view-box; transform-origin: 110px 186px; }
@keyframes bob { 0%,100% { transform: translateY(0) scale(1,1); } 50% { transform: translateY(-6px) scale(.98,1.02); } }
.armL, .armR { transform-box: view-box; }
.armL { transform-origin: 68px 128px; animation: waveL .8s ease-in-out infinite alternate; }
.armR { transform-origin: 152px 128px; animation: waveR .8s ease-in-out infinite alternate; }
@keyframes waveL { from { transform: rotate(-14deg); } to { transform: rotate(10deg); } }
@keyframes waveR { from { transform: rotate(14deg); } to { transform: rotate(-10deg); } }
.shadow { display: none; }
.float { animation: floaty 2.4s ease-in-out infinite; transform-box: view-box; transform-origin: center; }
@keyframes floaty { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
.jump .bob { animation: jump .6s cubic-bezier(.3,.7,.4,1); }
.jump .armL, .jump .armR { animation-duration: .18s; }
@keyframes jump {
  0% { transform: translateY(0) scale(1.06,.92); }
  35% { transform: translateY(-26px) scale(.95,1.06); }
  70% { transform: translateY(0) scale(1.05,.95); }
  100% { transform: translateY(0) scale(1,1); }
}
.enter { animation: enter .55s cubic-bezier(.3,1.5,.5,1); }
@keyframes enter { from { transform: translateY(30px) scale(.7) rotate(-8deg); opacity: 0; } to { transform: none; opacity: 1; } }

/* particles */
.p { position: absolute; top: -12%; width: var(--sz, 10px); height: var(--sz, 10px); opacity: .9; }
.p svg { width: 100%; height: 100%; display: block; }
.p.fall { animation: fall var(--dur, 9s) linear infinite; animation-delay: var(--del, 0s); }
.p.rain { animation: fall var(--dur, 1.6s) linear infinite; animation-delay: var(--del, 0s); }
.p.rise { top: auto; bottom: -10%; animation: rise var(--dur, 8s) ease-in infinite; animation-delay: var(--del, 0s); }
.p.twinkle { animation: twinkle var(--dur, 2.4s) ease-in-out infinite; animation-delay: var(--del, 0s); }
@keyframes fall {
  0% { transform: translate(0, 0) rotate(0); }
  50% { transform: translate(14px, 60cqh) rotate(160deg); }
  100% { transform: translate(-6px, 125cqh) rotate(320deg); }
}
@keyframes rise { 0% { transform: translate(0,0); opacity: 0; } 15% { opacity: .9; } 100% { transform: translate(10px, -120cqh); opacity: 0; } }
@keyframes twinkle { 0%,100% { transform: scale(.5); opacity: .3; } 50% { transform: scale(1); opacity: 1; } }
.moon {
  position: absolute; top: 14px; right: 18px; width: 44px; height: 44px; border-radius: 50%;
  background: radial-gradient(circle at 38% 38%, #FFF6CF, #FFE08A 60%, #F5C95B);
  border: 2px solid var(--ink);
}

/* burst */
.burst { position: absolute; left: 50%; top: 60%; width: 0; height: 0; pointer-events: none; z-index: 3; }
.burst i {
  position: absolute; width: 10px; height: 10px; border-radius: 3px; background: var(--c);
  border: 1.5px solid var(--ink);
  animation: burst .9s cubic-bezier(.2,.7,.3,1) forwards;
}
@keyframes burst {
  0% { transform: translate(0,0) rotate(0) scale(.6); opacity: 1; }
  100% { transform: translate(var(--dx), var(--dy)) rotate(260deg) scale(1); opacity: 0; }
}

/* calendar */
.card {
  border: 2.5px solid var(--ink); border-radius: 28px; background: var(--white);
  box-shadow: 6px 6px 0 var(--ink);
}
.cal { padding: 14px 10px 10px; display: flex; flex-direction: column; gap: 8px; touch-action: pan-y; }
.wk, .grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); }
.wk span { text-align: center; font-family: var(--font-display); font-size: 13px; }
.wk span:first-child { color: var(--pink-text); }
.wk span:last-child { color: var(--blue); }
.grid { gap: 4px; }
.cell {
  min-width: 0; min-height: 56px; padding: 4px 1px; border-radius: 14px;
  border: 2px solid transparent; background: transparent;
  display: flex; flex-direction: column; align-items: center; gap: 2px;
}
.cell:hover { background: var(--paper); }
.cell .num {
  width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center;
  font-weight: 800; font-size: 15px; font-variant-numeric: tabular-nums;
}
.cell.sat .num { color: var(--blue); }
.cell.sun .num, .cell.hol .num { color: var(--pink-text); }
.cell.today .num { background: var(--lime); border: 2px solid var(--ink); color: var(--ink); }
.cell.sel { background: var(--butter-soft); border-color: var(--ink); }
.cell .hn {
  max-width: 100%; font-size: 9.5px; font-weight: 800; line-height: 1.1; color: var(--pink-text);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 2px;
}
.cell .heart { width: 11px; height: 10px; display: block; }
.cell.other { visibility: hidden; pointer-events: none; }

/* day memo */
.day { padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.day-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.day-head strong { font-family: var(--font-display); font-weight: 400; font-size: 20px; }
.chip { border: 2px solid var(--ink); border-radius: 999px; padding: 1px 9px; font-size: 12px; font-weight: 800; }
.chip.today { background: var(--lime); }
.chip.hol { background: #FFD1E3; }
.day label { font-size: 12px; font-weight: 800; color: var(--sub); }
.lined {
  width: 100%; min-height: 112px; resize: vertical;
  border: 2px solid var(--ink); border-radius: 16px; padding: 4px 14px;
  background-color: var(--note);
  background-image: linear-gradient(transparent 27px, var(--rule) 27px, var(--rule) 28px);
  background-size: 100% 28px; background-attachment: local;
  font-family: var(--font-hand); font-weight: 700; font-size: 20px; line-height: 28px; color: var(--ink);
}
.lined::placeholder { color: var(--sub); opacity: .8; }
.lined:focus { outline: none; box-shadow: 0 0 0 3px var(--pink); }
.foot { margin: 0; text-align: center; font-size: 12px; font-weight: 600; color: var(--sub); line-height: 1.6; }

/* dream sheet */
.sheet-wrap { position: fixed; inset: 0; z-index: 50; display: flex; align-items: flex-end; justify-content: center; }
.backdrop { position: absolute; inset: 0; background: rgba(27,21,48,.5); border: 0; }
.sheet {
  position: relative; width: 100%; max-width: 460px; background: var(--white);
  border: 2.5px solid var(--ink); border-bottom: 0; border-radius: 32px 32px 0 0;
  padding: 30px max(20px, env(safe-area-inset-right, 0px)) calc(28px + env(safe-area-inset-bottom, 0px)) max(20px, env(safe-area-inset-left, 0px));
  display: flex; flex-direction: column; gap: 16px; animation: up .3s cubic-bezier(.3,1.3,.5,1);
}
.sheet .tape { left: 28px; margin-left: 0; transform: rotate(-5deg); background: repeating-linear-gradient(45deg, rgba(200,242,60,.9) 0 8px, rgba(255,255,255,.8) 8px 16px); }
@keyframes up { from { transform: translateY(60px); opacity: 0; } to { transform: none; opacity: 1; } }
.sheet h2 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 27px; line-height: 1.2; }
.sheet p { margin: 0; font-size: 14px; font-weight: 600; color: var(--sub); line-height: 1.55; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-size: 13px; font-weight: 800; }
.field input {
  height: 48px; border: 2px solid var(--ink); border-radius: 14px; padding: 0 14px;
  background: var(--note); font-size: 16px; font-weight: 600;
}
.field input:focus { outline: none; box-shadow: 0 0 0 3px var(--pink); }
.sheet .row { display: flex; gap: 10px; padding-top: 4px; }
.sheet .row .pill { flex: 1; height: 54px; justify-content: center; font-size: 15px; }
.sheet .row .more { flex: 2; font-size: 18px; }
.save-note { font-size: 12px; color: var(--sub); }

@media (max-width: 380px) {
  .cheer { grid-template-columns: 128px minmax(0, 1fr); }
  .shout { width: 90px; height: 90px; }
  .shout span { font-size: 16px; }
  .bubble { font-size: 18px; padding: 11px 12px; }
  .big { font-size: 76px; }
  .pill { padding: 0 12px; font-size: 13px; }
  .logo { font-size: 13px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition: none !important; }
  .p { display: none; }
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <span class="logo">화이팅 달력</span>
    <div class="actions">
      <button class="pill chunk" id="todayBtn">오늘</button>
      <button class="pill chunk yellow" id="dreamBtn"><svg width="14" height="14" viewBox="0 0 10 10" aria-hidden="true"><path d="M5 0 L6.2 3.8 L10 5 L6.2 6.2 L5 10 L3.8 6.2 L0 5 L3.8 3.8Z" fill="#1B1530"/></svg>내 꿈</button>
    </div>
  </header>

  <div class="month">
    <div class="month-title" aria-live="polite">
      <span class="big" id="moNum">10</span>
      <div class="month-sub"><span class="yr" id="yr">2026</span><span class="wol">월</span></div>
    </div>
    <div class="nav">
      <button class="round chunk" id="prev" aria-label="이전 달"><svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M11.5 3 L5.5 9 L11.5 15" fill="none" stroke="#1B1530" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <button class="round chunk" id="next" aria-label="다음 달"><svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M6.5 3 L12.5 9 L6.5 15" fill="none" stroke="#1B1530" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    </div>
  </div>

  <section class="stage" id="stage" aria-label="이달의 응원 캐릭터">
    <div class="sky" id="sky"></div>
    <div class="tape" aria-hidden="true"></div>
    <div class="tags"><span class="tag-dark" id="tagMonth">10월 응원단</span><span class="tag-light" id="tagName">여우 여울이</span></div>
    <div class="cheer">
      <button class="char-btn" id="charBtn" aria-label="캐릭터를 눌러 응원 받기">
        <span class="shout" id="shout" aria-hidden="true"><svg viewBox="0 0 120 120"><polygon points="60.0,1.0 70.5,14.2 85.6,6.8 89.3,23.3 106.1,23.2 102.3,39.6 117.5,46.9 107.0,60.0 117.5,73.1 102.3,80.4 106.1,96.8 89.3,96.7 85.6,113.2 70.5,105.8 60.0,119.0 49.5,105.8 34.4,113.2 30.7,96.7 13.9,96.8 17.7,80.4 2.5,73.1 13.0,60.0 2.5,46.9 17.7,39.6 13.9,23.2 30.7,23.3 34.4,6.8 49.5,14.2" fill="#C8F23C" stroke="#1B1530" stroke-width="2.5" stroke-linejoin="round"/></svg><span id="shoutText">화이팅!</span></span>
        <span class="sticker" id="charHost"></span>
        <span class="burst" id="burst"></span>
      </button>
      <div class="say">
        <div class="bubble" id="bubble" aria-live="polite"></div>
        <button class="link-btn" id="askDream" hidden>내 꿈 알려 주기</button>
      </div>
    </div>
    <button class="more" id="moreBtn">한 번 더 응원해 줘!</button>
    <div class="goal">
      <label for="goal" id="goalLabel">10월 목표</label>
      <input id="goal" type="text" maxlength="60" placeholder="이번 달에 해낼 한 가지" autocomplete="off">
    </div>
  </section>

  <section class="card cal" id="cal" aria-label="달력">
    <div class="wk"><span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span></div>
    <div class="grid" id="grid"></div>
  </section>

  <section class="card day" aria-label="선택한 날짜">
    <div class="day-head"><strong id="dayTitle">10월 21일 수요일</strong><span class="chip today" id="dayToday" hidden>오늘</span><span class="chip hol" id="dayHol" hidden></span></div>
    <label for="memo">이날의 메모</label>
    <textarea class="lined" id="memo" placeholder="할 일이나 기억할 것을 적어 두세요"></textarea>
  </section>

  <p class="foot"><span id="saveState">이 브라우저에 저장돼요</span><br>캐릭터를 톡 누르면 점프하면서 다른 응원을 해 줘요.<br>공휴일은 2026~2027년 반영, 달력은 좌우로 밀어서 넘겨요.</p>
</div>

<div class="sheet-wrap" id="sheetWrap" hidden>
  <button class="backdrop" id="backdrop" aria-label="닫기"></button>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="tape" aria-hidden="true"></div>
    <h2 id="sheetTitle">응원단에게<br>꿈을 알려 줘!</h2>
    <p>적어 둔 꿈은 열두 달 캐릭터가 돌아가면서 크게 불러 줘요.</p>
    <div class="field">
      <label for="nameIn">불러 줄 이름</label>

        front = `<ellipse cx="110" cy="128" rx="36" ry="30" fill="#F6E1C9"/>
                 <circle cx="64" cy="108" r="12" fill="#D9B38C" ${st}/><path d="M64 108 m-5 0 a5 5 0 1 0 5 -5" fill="none" stroke="${INK}" stroke-width="2"/>
                 <circle cx="156" cy="108" r="12" fill="#D9B38C" ${st}/><path d="M156 108 m5 0 a5 5 0 1 1 -5 -5" fill="none" stroke="${INK}" stroke-width="2"/>`;
        break;
      }
    }

    // accessories
    if (c.acc === "scarf") {
      const [a, b] = c.scarf;
      top += `<g clip-path="url(#${uid}b)"><rect x="40" y="150" width="140" height="17" fill="${a}"/>
               <rect x="60" y="150" width="9" height="17" fill="${b}"/><rect x="88" y="150" width="9" height="17" fill="${b}"/><rect x="116" y="150" width="9" height="17" fill="${b}"/><rect x="144" y="150" width="9" height="17" fill="${b}"/></g>
              <path d="M56 150 Q110 160 164 150 M56 167 Q110 177 164 167" fill="none" stroke="${INK}" stroke-width="2.5" clip-path="url(#${uid}b)"/>
              <rect x="128" y="160" width="15" height="28" rx="3" transform="rotate(8 135 174)" fill="${a}" ${st}/>`;
    }
    if (c.acc === "heart") {
      top += `<g class="float"><path d="M168 82 C156 72 152 62 160 56 C165 52 170 55 172 60 C174 55 179 52 184 56 C192 62 186 72 172 82Z" transform="translate(-4 -6)" fill="#FF6F91" ${st}/></g>`;
    }
    if (c.acc === "shell") {
      top += `<path d="M54 146 L66 136 L78 148 L90 136 L102 148 L114 136 L126 148 L138 136 L150 148 L166 138 C170 196 50 196 54 146Z" fill="#FFFDF5" ${st}/>
              <path d="M76 168 l6 4 M136 172 l6 -4" stroke="#E8DFC8" stroke-width="3" stroke-linecap="round"/>`;
    }
    if (c.acc === "crown") {
      const cols = ["#FF8FB1", "#FFD36E", "#B39DFF", "#8FD3FF", "#FF8FB1"];
      for (let i = 0; i < 5; i++) {
        const a = Math.PI * (1.2 + .6 * i / 4), x = 110 + 50 * Math.cos(a), y = 132 + 52 * Math.sin(a) + 4;
        let f = "";
        for (let k = 0; k < 5; k++) { const t = (Math.PI * 2 / 5) * k; f += `<circle cx="${(x + 5 * Math.cos(t)).toFixed(1)}" cy="${(y + 5 * Math.sin(t)).toFixed(1)}" r="4.2" fill="${cols[i]}" stroke="${INK}" stroke-width="1.2"/>`; }
        top += f + `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="2.8" fill="#FFF3B0"/>`;
      }
    }
    if (c.acc === "maple") {
      top += `<path d="M146 96 l8 12" stroke="${INK}" stroke-width="2.5" stroke-linecap="round"/><polygon points="${star(144, 88, 16, 8, 5, .3)}" fill="#E8573A" stroke="${INK}" stroke-width="2.5" stroke-linejoin="round"/>`;
    }
    if (c.acc === "beanie") {
      top += `<path d="M58 112 C56 60 164 60 162 112 Z" fill="#E07A5F" ${st}/>
              <rect x="54" y="102" width="112" height="16" rx="8" fill="#F2CC8F" ${st}/>
              <path d="M74 102 v16 M90 102 v16 M106 102 v16 M122 102 v16 M138 102 v16 M154 102 v16" stroke="#D9AE6E" stroke-width="2"/>
              <circle cx="110" cy="62" r="11" fill="#F4F1DE" ${st}/>`;
      eyes = [[92, 128], [128, 128]];
    }

    const mouthY = c.acc === "beanie" ? 142 : 136;
    const mouthCol = c.mouth || "#C8414F";
    const mouth = c.mouth
      ? `<path d="M100 ${mouthY} L110 ${mouthY - 5} L120 ${mouthY} L110 ${mouthY + 12}Z" fill="${mouthCol}" ${st}/><path d="M100 ${mouthY} L120 ${mouthY}" stroke="${INK}" stroke-width="2"/>`
      : `<path d="M98 ${mouthY} Q110 ${mouthY + 22} 122 ${mouthY} Z" fill="${mouthCol}" ${st}/><path d="M104 ${mouthY + 9} Q110 ${mouthY + 4} 116 ${mouthY + 9} Q110 ${mouthY + 15} 104 ${mouthY + 9}Z" fill="#FF8A93"/>`;
    const noseEl = nose ? `<ellipse cx="110" cy="${mouthY - 7}" rx="4.5" ry="3.2" fill="${INK}"/>` : "";
    const eyeEls = eyes.map(([x, y]) => `<ellipse cx="${x}" cy="${y}" rx="5" ry="6.2" fill="${INK}"/><circle cx="${x + 1.8}" cy="${y - 2.4}" r="2" fill="#fff"/>`).join("");
    const cheekY = (c.acc === "beanie" ? 138 : 132);
    const cheeks = c.kind === "frog" ? `<ellipse cx="80" cy="128" rx="8" ry="5" fill="#FF8FA3" opacity=".55"/><ellipse cx="140" cy="128" rx="8" ry="5" fill="#FF8FA3" opacity=".55"/>`
      : `<ellipse cx="78" cy="${cheekY}" rx="8" ry="5" fill="#FF8FA3" opacity=".6"/><ellipse cx="142" cy="${cheekY}" rx="8" ry="5" fill="#FF8FA3" opacity=".6"/>`;
    const arm = (sx, sy, hx, hy) =>
      `<path d="M${sx} ${sy} Q${(sx + hx) / 2 + (hx < 110 ? -4 : 4)} ${(sy + hy) / 2} ${hx} ${hy}" stroke="${INK}" stroke-width="20" fill="none" stroke-linecap="round"/>
       <path d="M${sx} ${sy} Q${(sx + hx) / 2 + (hx < 110 ? -4 : 4)} ${(sy + hy) / 2} ${hx} ${hy}" stroke="${B}" stroke-width="14" fill="none" stroke-linecap="round"/>`;

    return `<svg viewBox="0 0 220 210" role="img" aria-label="${c.sp} ${c.name}" xmlns="http://www.w3.org/2000/svg">
      <defs><clipPath id="${uid}b"><ellipse cx="110" cy="132" rx="56" ry="54"/></clipPath></defs>
      <ellipse class="shadow" cx="110" cy="196" rx="50" ry="7" fill="${INK}"/>
      <g class="bob">
        ${back}
        <g class="armL">${arm(70, 128, 34, 82)}${pompom(30, 76, c.pom)}</g>
        <g class="armR">${arm(150, 128, 186, 82)}${pompom(190, 76, c.pom)}</g>
        <ellipse cx="90" cy="186" rx="14" ry="8" fill="${B}" ${st}/><ellipse cx="130" cy="186" rx="14" ry="8" fill="${B}" ${st}/>
        <ellipse cx="110" cy="132" rx="56" ry="54" fill="${B}" ${st}/>
        ${L ? `<ellipse cx="110" cy="156" rx="32" ry="24" fill="${L}" clip-path="url(#${uid}b)"/>` : ""}
        <ellipse cx="86" cy="98" rx="12" ry="6" transform="rotate(-30 86 98)" fill="#fff" opacity=".45"/>
        ${front}
        ${cheeks}${eyeEls}${noseEl}${mouth}
        ${top}
      </g>
    </svg>`;
  }

  /* ---------- particles ---------- */
  const SHAPES = {
    snow: () => `<svg viewBox="0 0 10 10"><circle cx="5" cy="5" r="4" fill="#fff" stroke="rgba(110,130,180,.4)"/></svg>`,
    heart: () => `<svg viewBox="0 0 10 10"><path d="M5 9 C1 6 0 4 1.5 2.5 C3 1 4.5 1.8 5 3 C5.5 1.8 7 1 8.5 2.5 C10 4 9 6 5 9Z" fill="#FF7D9C"/></svg>`,
    petal: () => `<svg viewBox="0 0 10 10"><ellipse cx="5" cy="5" rx="3" ry="4.6" fill="#FFB3C7"/></svg>`,
    forsythia: () => `<svg viewBox="0 0 10 10"><g fill="#FFCF33"><ellipse cx="5" cy="2.6" rx="1.6" ry="2.6"/><ellipse cx="5" cy="7.4" rx="1.6" ry="2.6"/><ellipse cx="2.6" cy="5" rx="2.6" ry="1.6"/><ellipse cx="7.4" cy="5" rx="2.6" ry="1.6"/></g></svg>`,
    lilac: () => `<svg viewBox="0 0 10 10"><g fill="#C3A0FF"><circle cx="5" cy="2.4" r="2"/><circle cx="7.5" cy="4.3" r="2"/><circle cx="6.5" cy="7.4" r="2"/><circle cx="3.5" cy="7.4" r="2"/><circle cx="2.5" cy="4.3" r="2"/></g><circle cx="5" cy="5.2" r="1.3" fill="#FFF3B0"/></svg>`,
    rain: () => `<svg viewBox="0 0 10 10"><line x1="6" y1="0" x2="4" y2="10" stroke="#5FA9D1" stroke-width="1.3" stroke-linecap="round"/></svg>`,
    sparkle: () => `<svg viewBox="0 0 10 10"><path d="M5 0 L6.2 3.8 L10 5 L6.2 6.2 L5 10 L3.8 6.2 L0 5 L3.8 3.8Z" fill="#FFA928"/></svg>`,
    bubble: () => `<svg viewBox="0 0 10 10"><circle cx="5" cy="5" r="4" fill="rgba(255,255,255,.25)" stroke="#4FA6DD" stroke-width="1"/></svg>`,
    star: () => `<svg viewBox="0 0 10 10"><path d="M5 0 L6.2 3.8 L10 5 L6.2 6.2 L5 10 L3.8 6.2 L0 5 L3.8 3.8Z" fill="#FFD966"/></svg>`,
    leaf: (i) => `<svg viewBox="0 0 40 40"><polygon points="${star(20, 21, 18, 9, 5, 0)}" fill="${i % 2 ? "#F2A33A" : "#E8613A"}"/></svg>`,
    brownleaf: (i) => `<svg viewBox="0 0 10 10"><path d="M5 0 C9 3 9 7 5 10 C1 7 1 3 5 0Z" fill="${i % 2 ? "#B07A3C" : "#8DB255"}"/></svg>`
  };
  function makeSky(fx) {
    const sky = $("sky"); let html = "";
    if (fx === "star") html += `<div class="moon"></div>`;
    const mode = fx === "rain" ? "rain" : fx === "bubble" ? "rise" : (fx === "sparkle" || fx === "star") ? "twinkle" : "fall";
    const n = fx === "rain" ? 20 : 14;
    for (let i = 0; i < n; i++) {
      const left = (i / n) * 100 + Math.random() * (100 / n);
      const sz = fx === "rain" ? 14 : fx === "leaf" ? 13 + Math.random() * 6 : 7 + Math.random() * 7;
      const dur = mode === "rain" ? 1.1 + Math.random() * .7 : mode === "twinkle" ? 1.8 + Math.random() * 2 : 7 + Math.random() * 6;
      const del = -Math.random() * dur;
      let style = `left:${left.toFixed(1)}%;--sz:${sz.toFixed(1)}px;--dur:${dur.toFixed(2)}s;--del:${del.toFixed(2)}s;`;
      if (mode === "twinkle") style += `top:${(5 + Math.random() * 80).toFixed(1)}%;`;
      html += `<span class="p ${mode}" style="${style}">${SHAPES[fx](i)}</span>`;
    }
    sky.innerHTML = html;
  }

  /* ---------- cheer logic ---------- */
  function goalText() { return (state.goals[ym(view.y, view.m)] || "").trim(); }
  function lines() {
    const c = CREW[view.m], d = (state.dream || "").trim(), g = goalText();
    let L = c.lines.filter(t => (d || !t.includes("{d}")) && (g || !t.includes("{g}")));
    if (!d) L = ["{v}, 네 꿈이 뭐야? 알려 주면 매달 내가 크게 불러 줄게!"].concat(L);
    return L.map(t => t.split("{v}").join(voc()).split("{d}").join(d).split("{g}").join(g));
  }
  function showLine(animate) {
    const L = lines(), b = $("bubble");
    b.textContent = L[lineIdx % L.length];
    if (animate) { b.classList.remove("fade"); void b.offsetWidth; b.classList.add("fade"); }
    $("askDream").hidden = !!(state.dream || "").trim();
  }
  function shout(text) {
    const s = $("shout"), t = $("shoutText");
    t.textContent = text;
    t.style.fontSize = text.length > 5 ? "15px" : "19px";
    s.classList.remove("pop"); void s.offsetWidth; s.classList.add("pop");
  }
  function burst() {
    if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    const host = $("burst"), c = CREW[view.m];
    const cols = [c.pom, "#C8F23C", "#FF4FA3", "#FFE45C", "#8FD8FF"];
    let html = "";
    for (let i = 0; i < 14; i++) {
      const a = Math.random() * Math.PI * 2, r = 60 + Math.random() * 60;
      html += `<i style="--c:${cols[i % cols.length]};--dx:${(Math.cos(a) * r).toFixed(0)}px;--dy:${(Math.sin(a) * r - 30).toFixed(0)}px"></i>`;
    }
    host.innerHTML = html;
    setTimeout(() => { host.innerHTML = ""; }, 950);
  }
  function cheer(customShout) {
    lineIdx++; shoutIdx++;
    shout(customShout || SHOUTS[shoutIdx % SHOUTS.length]);
    showLine(true); burst();
    const btn = $("charBtn");
    btn.classList.remove("jump"); void btn.offsetWidth; btn.classList.add("jump");
    clearTimeout(cheer.t); cheer.t = setTimeout(() => btn.classList.remove("jump"), 650);
  }

  /* ---------- render ---------- */
  function renderStage(animate) {
    const c = CREW[view.m];
    $("stage").style.setProperty("--card", CARD[view.m]);
    $("tagMonth").textContent = `${view.m + 1}월 응원단`;
    $("tagName").textContent = `${c.sp} ${c.name}`;
    $("charHost").innerHTML = charSVG(c, view.m);
    if (animate) { const s = $("charHost").firstElementChild; s.classList.add("enter"); }
    $("charBtn").setAttribute("aria-label", `응원 받기: ${c.sp} ${c.name}`);
    makeSky(c.fx);
    $("goalLabel").textContent = `${view.m + 1}월 목표`;
    const gi = $("goal"); if (document.activeElement !== gi) gi.value = state.goals[ym(view.y, view.m)] || "";
    lineIdx = 0; shoutIdx = 0;
    shout("화이팅!"); showLine(animate);
  }
  function renderHeader() {
    $("yr").textContent = String(view.y);
    const big = $("moNum");
    big.textContent = String(view.m + 1);
    big.classList.remove("pop"); void big.offsetWidth; big.classList.add("pop");
  }
  function renderGrid() {
    const g = $("grid"), first = new Date(view.y, view.m, 1).getDay();
    const days = new Date(view.y, view.m + 1, 0).getDate();
    const prevDays = new Date(view.y, view.m, 0).getDate();
    const total = Math.ceil((first + days) / 7) * 7;
    const tk = key(now.getFullYear(), now.getMonth(), now.getDate());
    const sk = key(sel.y, sel.m, sel.d);
    let html = "";
    for (let i = 0; i < total; i++) {
      const dow = i % 7;
      if (i < first || i >= first + days) {
        const n = i < first ? prevDays - first + i + 1 : i - first - days + 1;
        html += `<button class="cell other" tabindex="-1" aria-hidden="true"><span class="num">${n}</span></button>`;
        continue;
      }
      const d = i - first + 1, k = key(view.y, view.m, d), hol = HOLIDAYS[k];
      const cls = ["cell", dow === 0 ? "sun" : "", dow === 6 ? "sat" : "", hol ? "hol" : "", k === tk ? "today" : "", k === sk ? "sel" : ""].join(" ");
      const memo = (state.notes[k] || "").trim();
      const label = `${view.m + 1}월 ${d}일 ${WD[dow]}${hol ? ", " + hol : ""}${memo ? ", 메모 있음" : ""}`;
      html += `<button class="${cls}" data-d="${d}" aria-label="${label}"${k === sk ? ' aria-current="date"' : ""}><span class="num">${d}</span>${hol ? `<span class="hn">${hol}</span>` : ""}${memo ? HEART : ""}</button>`;
    }
    g.innerHTML = html;
  }
  function renderDay() {
    const dow = new Date(sel.y, sel.m, sel.d).getDay(), k = key(sel.y, sel.m, sel.d), hol = HOLIDAYS[k];
    $("dayTitle").textContent = `${sel.m + 1}월 ${sel.d}일 ${WD[dow]}`;
    const hc = $("dayHol"); hc.hidden = !hol; hc.textContent = hol || "";
    $("dayToday").hidden = !(sel.y === now.getFullYear() && sel.m === now.getMonth() && sel.d === now.getDate());
    const memo = $("memo"); if (document.activeElement !== memo) memo.value = state.notes[k] || "";
  }
  function renderAll(animate) { renderHeader(); renderStage(animate); renderGrid(); renderDay(); }

  function go(delta) {
    let m = view.m + delta, y = view.y;
    if (m < 0) { m = 11; y--; } if (m > 11) { m = 0; y++; }
    view = { y, m };
    sel = (y === now.getFullYear() && m === now.getMonth()) ? { y, m, d: now.getDate() } : { y, m, d: 1 };
    renderAll(true);
  }

  /* ---------- events ---------- */
  $("prev").addEventListener("click", () => go(-1));
  $("next").addEventListener("click", () => go(1));
  $("todayBtn").addEventListener("click", () => {
    view = { y: now.getFullYear(), m: now.getMonth() };
    sel = { y: view.y, m: view.m, d: now.getDate() };
    renderAll(true);
  });
  $("charBtn").addEventListener("click", () => cheer());
  $("moreBtn").addEventListener("click", () => cheer());
  $("grid").addEventListener("click", e => {
    const b = e.target.closest(".cell[data-d]"); if (!b) return;
    sel = { y: view.y, m: view.m, d: +b.dataset.d };
    renderGrid(); renderDay();
  });
  $("memo").addEventListener("input", e => {
    const k = key(sel.y, sel.m, sel.d), v = e.target.value;
    const had = !!(state.notes[k] || "").trim();
    if (v.trim()) state.notes[k] = v; else delete state.notes[k];
    if (had !== !!v.trim()) renderGrid();
    saveSoon();
  });
  $("goal").addEventListener("input", e => {
    const k = ym(view.y, view.m), v = e.target.value;
    if (v.trim()) state.goals[k] = v; else delete state.goals[k];
    saveSoon();
  });
  $("goal").addEventListener("change", () => {
    const L = lines(), idx = L.findIndex(t => goalText() && t.includes(goalText()));
    if (idx >= 0) { lineIdx = idx - 1; cheer("접수 완료!"); } else showLine(true);
  });
  $("goal").addEventListener("keydown", e => { if (e.key === "Enter") e.target.blur(); });

  // swipe months
  let sx = null, sy = null;
  $("cal").addEventListener("touchstart", e => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, { passive: true });
  $("cal").addEventListener("touchend", e => {
    if (sx === null) return;
    const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.4) go(dx < 0 ? 1 : -1);
    sx = sy = null;
  });
  document.addEventListener("keydown", e => {
    if (!$("sheetWrap").hidden) { if (e.key === "Escape") closeSheet(); return; }
    if (e.target.closest("input, textarea")) return;
    if (e.key === "ArrowLeft") go(-1);
    if (e.key === "ArrowRight") go(1);
  });

  // dream sheet
  function openSheet() {
    $("nameIn").value = state.name || "";
    $("dreamIn").value = state.dream || "";
    $("sheetWrap").hidden = false;
    setTimeout(() => $("dreamIn").focus(), 50);
  }
  function closeSheet() { $("sheetWrap").hidden = true; $("dreamBtn").focus(); }
  $("dreamBtn").addEventListener("click", openSheet);
  $("askDream").addEventListener("click", openSheet);
  $("backdrop").addEventListener("click", closeSheet);
  $("cancelBtn").addEventListener("click", closeSheet);
  $("saveBtn").addEventListener("click", () => {
    state.name = $("nameIn").value.trim() || "아로";
    state.dream = $("dreamIn").value.trim();
    saveSoon(); closeSheet();
    lineIdx = 0;
    const L = lines(), idx = state.dream ? L.findIndex(t => t.includes(state.dream)) : 0;
    lineIdx = Math.max(0, idx) - 1;
    cheer(state.dream ? "꿈 접수 완료!" : "화이팅!");
  });

  renderAll(true);
})();
</script>
</body>
</html>
