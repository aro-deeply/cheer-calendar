<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F2904F">
<title>화이팅 달력</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
/* Layout: one phone-width column. Cheer stage (character + bubble) on top, month grid, then the selected day's memo. Month hue (--h) drives every token. */
:root {
  --h: 15; --s: 65%;
  --bg: hsl(var(--h) 35% 97%);
  --surface: hsl(var(--h) 40% 99.5%);
  --ink: hsl(var(--h) 22% 16%);
  --muted: hsl(var(--h) 10% 42%);
  --line: hsl(var(--h) 22% 88%);
  --accent: hsl(var(--h) var(--s) 46%);
  --accent-ink: hsl(var(--h) 40% 99%);
  --soft: hsl(var(--h) 75% 91%);
  --soft2: hsl(calc(var(--h) + 30) 80% 95%);
  --sun: hsl(358 70% 50%);
  --sat: hsl(218 70% 50%);
  --shadow: hsl(var(--h) 30% 30% / .12);
  --font-display: "Jua", "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: hsl(var(--h) 18% 9%);
    --surface: hsl(var(--h) 16% 13%);
    --ink: hsl(var(--h) 25% 93%);
    --muted: hsl(var(--h) 10% 66%);
    --line: hsl(var(--h) 12% 23%);
    --accent: hsl(var(--h) var(--s) 66%);
    --accent-ink: hsl(var(--h) 35% 10%);
    --soft: hsl(var(--h) 32% 20%);
    --soft2: hsl(calc(var(--h) + 30) 28% 15%);
    --sun: hsl(358 85% 72%);
    --sat: hsl(215 90% 74%);
    --shadow: hsl(0 0% 0% / .35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: hsl(var(--h) 18% 9%);
  --surface: hsl(var(--h) 16% 13%);
  --ink: hsl(var(--h) 25% 93%);
  --muted: hsl(var(--h) 10% 66%);
  --line: hsl(var(--h) 12% 23%);
  --accent: hsl(var(--h) var(--s) 66%);
  --accent-ink: hsl(var(--h) 35% 10%);
  --soft: hsl(var(--h) 32% 20%);
  --soft2: hsl(calc(var(--h) + 30) 28% 15%);
  --sun: hsl(358 85% 72%);
  --sat: hsl(215 90% 74%);
  --shadow: hsl(0 0% 0% / .35);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; }
[hidden] { display: none !important; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 15px; line-height: 1.5;
  word-break: keep-all; transition: background .5s ease;
  -webkit-tap-highlight-color: transparent;
}
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.app {
  max-width: 480px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 14px 28px;
  display: flex; flex-direction: column; gap: 14px;
}

/* header */
.top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.month-nav { display: flex; align-items: center; gap: 6px; }
.round {
  width: 40px; height: 40px; border-radius: 50%;
  border: 1px solid var(--line); background: var(--surface);
  display: grid; place-items: center; font-size: 20px; line-height: 1;
}
.title { min-width: 92px; text-align: center; }
.title .yr { display: block; font-size: 12.5px; color: var(--muted); letter-spacing: .04em; font-variant-numeric: tabular-nums; }
.title .mo { display: block; font-family: var(--font-display); font-size: 38px; line-height: 1; color: var(--ink); }
.actions { display: flex; gap: 6px; }
.pill {
  height: 36px; padding: 0 14px; border-radius: 999px;
  border: 1px solid var(--line); background: var(--surface);
  font-size: 14px; font-weight: 500; white-space: nowrap;
}
.pill.solid { background: var(--accent); color: var(--accent-ink); border-color: transparent; }

/* cheer stage */
.stage {
  position: relative; overflow: hidden; border-radius: 26px;
  background: linear-gradient(160deg, var(--soft), var(--soft2));
  padding: 14px 14px 16px;
  display: grid; grid-template-columns: 148px minmax(0, 1fr); gap: 6px 10px; align-items: center;
}
.sky { position: absolute; inset: 0; pointer-events: none; z-index: 0; }
.stage > *:not(.sky) { position: relative; z-index: 1; }
.tag {
  grid-column: 1 / -1; justify-self: start;
  font-size: 12.5px; font-weight: 600; color: var(--accent);
  background: var(--surface); border-radius: 999px; padding: 3px 11px;
  box-shadow: 0 1px 0 var(--shadow);
}
.char-btn {
  border: 0; background: none; padding: 26px 0 0; position: relative;
  display: block; width: 100%; border-radius: 20px;
}
.char-btn svg { display: block; width: 100%; height: auto; overflow: visible; }
.shout {
  position: absolute; top: 0; left: 50%; z-index: 2;
  font-family: var(--font-display); font-size: 30px; line-height: 1; white-space: nowrap;
  color: var(--accent);
  -webkit-text-stroke: 6px var(--surface); paint-order: stroke fill;
  transform: translateX(-50%) rotate(-7deg);
}
.shout.pop { animation: pop .55s cubic-bezier(.3,1.6,.5,1); }
@keyframes pop {
  0% { transform: translateX(-50%) rotate(-7deg) scale(.3); opacity: 0; }
  100% { transform: translateX(-50%) rotate(-7deg) scale(1); opacity: 1; }
}
.say { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.bubble {
  position: relative; background: var(--surface); border-radius: 18px;
  padding: 12px 14px; font-family: var(--font-display); font-size: 17px; line-height: 1.5;
  box-shadow: 0 2px 10px var(--shadow); min-height: 78px; display: flex; align-items: center;
}
.bubble::before {
  content: ""; position: absolute; left: -9px; top: 50%; margin-top: -9px;
  border: 9px solid transparent; border-left: 0; border-right-color: var(--surface);
}
.bubble.fade { animation: fadein .35s ease; }
@keyframes fadein { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
.link-btn {
  align-self: flex-start; border: 0; background: none; padding: 2px 4px;
  color: var(--accent); font-weight: 600; font-size: 14px; text-decoration: underline; text-underline-offset: 3px;
}
.stage-foot { grid-column: 1 / -1; display: flex; flex-direction: column; gap: 10px; margin-top: 4px; }
.more { width: 100%; height: 44px; font-size: 15px; font-family: var(--font-display); font-weight: 400; }
.goal {
  display: flex; align-items: center; gap: 8px;
  background: var(--surface); border-radius: 14px; padding: 4px 4px 4px 12px;
}
.goal label { font-size: 13px; font-weight: 600; color: var(--accent); white-space: nowrap; }
.goal input {
  flex: 1; min-width: 0; border: 0; background: transparent; height: 38px; padding: 0 8px;
  font-size: 15px;
}
.goal input:focus { outline: none; }
.goal:focus-within { box-shadow: 0 0 0 2px var(--accent); }

/* character motion */
.bob { animation: bob 1.6s ease-in-out infinite; transform-box: view-box; transform-origin: 110px 186px; }
@keyframes bob { 0%,100% { transform: translateY(0) scale(1,1); } 50% { transform: translateY(-6px) scale(.98,1.02); } }
.armL, .armR { transform-box: view-box; }
.armL { transform-origin: 68px 128px; animation: waveL .8s ease-in-out infinite alternate; }
.armR { transform-origin: 152px 128px; animation: waveR .8s ease-in-out infinite alternate; }
@keyframes waveL { from { transform: rotate(-14deg); } to { transform: rotate(10deg); } }
@keyframes waveR { from { transform: rotate(14deg); } to { transform: rotate(-10deg); } }
.shadow { transform-box: view-box; transform-origin: 110px 196px; animation: shadow 1.6s ease-in-out infinite; }
@keyframes shadow { 0%,100% { transform: scaleX(1); opacity: .22; } 50% { transform: scaleX(.88); opacity: .15; } }
.float { animation: floaty 2.4s ease-in-out infinite; transform-box: view-box; transform-origin: center; }
@keyframes floaty { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
.jump .bob { animation: jump .6s cubic-bezier(.3,.7,.4,1); }
.jump .armL, .jump .armR { animation-duration: .18s; }
@keyframes jump {
  0% { transform: translateY(0) scale(1.06,.92); }
  35% { transform: translateY(-26px) scale(.95,1.06); }
  70% { transform: translateY(0) scale(1.05,.95); }
  100% { transform: translateY(0) scale(1,1); }
}
.enter { animation: enter .55s cubic-bezier(.3,1.5,.5,1); }
@keyframes enter { from { transform: translateY(30px) scale(.7); opacity: 0; } to { transform: none; opacity: 1; } }

/* particles */
.p { position: absolute; top: -12%; width: var(--sz, 10px); height: var(--sz, 10px); opacity: .9; }
.p svg { width: 100%; height: 100%; display: block; }
.p.fall { animation: fall var(--dur, 9s) linear infinite; animation-delay: var(--del, 0s); }
.p.rain { animation: fall var(--dur, 1.6s) linear infinite; animation-delay: var(--del, 0s); }
.p.rise { top: auto; bottom: -10%; animation: rise var(--dur, 8s) ease-in infinite; animation-delay: var(--del, 0s); }
.p.twinkle { animation: twinkle var(--dur, 2.4s) ease-in-out infinite; animation-delay: var(--del, 0s); }
@keyframes fall {
  0% { transform: translate(0, 0) rotate(0); }
  50% { transform: translate(14px, 60cqh) rotate(160deg); }
  100% { transform: translate(-6px, 125cqh) rotate(320deg); }
}
@keyframes rise { 0% { transform: translate(0,0); opacity: 0; } 15% { opacity: .9; } 100% { transform: translate(10px, -120cqh); opacity: 0; } }
@keyframes twinkle { 0%,100% { transform: scale(.5); opacity: .3; } 50% { transform: scale(1); opacity: 1; } }
.sky { container-type: size; }
.moon {
  position: absolute; top: 12px; right: 16px; width: 46px; height: 46px; border-radius: 50%;
  background: radial-gradient(circle at 38% 38%, #FFF6CF, #FFE08A 60%, #F5C95B);
  box-shadow: 0 0 24px 6px rgba(255, 224, 138, .45);
}

/* burst */
.burst { position: absolute; left: 50%; top: 58%; width: 0; height: 0; pointer-events: none; z-index: 3; }
.burst i {
  position: absolute; width: 9px; height: 9px; border-radius: 3px; background: var(--c);
  animation: burst .9s cubic-bezier(.2,.7,.3,1) forwards;
}
@keyframes burst {
  0% { transform: translate(0,0) rotate(0) scale(.6); opacity: 1; }
  100% { transform: translate(var(--dx), var(--dy)) rotate(260deg) scale(1); opacity: 0; }
}

/* calendar */
.cal {
  background: var(--surface); border: 1px solid var(--line); border-radius: 22px;
  padding: 10px 8px 8px; touch-action: pan-y;
}
.wk, .grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); }
.wk span {
  text-align: center; font-size: 12px; font-weight: 600; color: var(--muted);
  padding-bottom: 6px; letter-spacing: .04em;
}
.wk span:first-child { color: var(--sun); }
.wk span:last-child { color: var(--sat); }
.grid { gap: 2px; }
.cell {
  border: 0; background: none; border-radius: 12px; min-height: 56px; min-width: 0;
  padding: 5px 1px 4px; display: flex; flex-direction: column; align-items: center; gap: 2px;
}
.cell .num {
  width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center;
  font-size: 15px; font-weight: 500; font-variant-numeric: tabular-nums;
}
.cell.sun .num, .cell.hol .num { color: var(--sun); }
.cell.sat .num { color: var(--sat); }
.cell.today .num { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
.cell.sel { background: var(--soft); }
.cell .hn {
  max-width: 100%; font-size: 9.5px; line-height: 1.2; color: var(--sun);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 2px;
}
.cell .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
.cell.other { opacity: .32; pointer-events: none; }

/* day panel */
.day {
  background: var(--surface); border: 1px solid var(--line); border-radius: 22px;
  padding: 14px; display: flex; flex-direction: column; gap: 10px;
}
.day-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.day-head strong { font-size: 16px; font-weight: 600; }
.chip { font-size: 12px; font-weight: 600; color: var(--sun); border: 1px solid currentColor; border-radius: 999px; padding: 1px 9px; }
.day textarea {
  width: 100%; min-height: 92px; resize: vertical; border: 1px solid var(--line); border-radius: 14px;
  background: var(--bg); padding: 10px 12px; font-size: 15px; line-height: 1.55;
}
.day textarea:focus { outline: none; border-color: var(--accent); }
.foot { font-size: 12px; color: var(--muted); text-align: center; line-height: 1.6; }

/* sheet */
.sheet-wrap { position: fixed; inset: 0; z-index: 50; display: flex; align-items: flex-end; justify-content: center; }
.backdrop { position: absolute; inset: 0; background: hsl(var(--h) 20% 8% / .45); border: 0; }
.sheet {
  position: relative; width: 100%; max-width: 480px; background: var(--surface);
  border-radius: 24px 24px 0 0;
  padding: 18px max(18px, env(safe-area-inset-right, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px));
  display: flex; flex-direction: column; gap: 14px; animation: up .3s ease;
}
@keyframes up { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
.sheet h2 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 22px; }
.sheet p { margin: 0; color: var(--muted); font-size: 14px; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-size: 13px; font-weight: 600; }
.field input, .field textarea {
  border: 1px solid var(--line); border-radius: 12px; background: var(--bg);
  padding: 10px 12px; font-size: 15px;
}
.field textarea { min-height: 72px; resize: vertical; line-height: 1.5; }
.field input:focus, .field textarea:focus { outline: none; border-color: var(--accent); }
.sheet .row { display: flex; gap: 8px; }
.sheet .row .pill { flex: 1; height: 44px; }
.save-note { font-size: 12px; color: var(--muted); }

@media (max-width: 380px) {
  .stage { grid-template-columns: 116px minmax(0, 1fr); }
  .shout { font-size: 24px; }
  .bubble { font-size: 15.5px; padding: 10px 12px; }
  .title .mo { font-size: 32px; }
  .pill { padding: 0 11px; font-size: 13px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition: none !important; }
  .p { display: none; }
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="month-nav">
      <button class="round" id="prev" aria-label="이전 달">‹</button>
      <div class="title" aria-live="polite"><span class="yr" id="yr">2026</span><span class="mo" id="mo">10월</span></div>
      <button class="round" id="next" aria-label="다음 달">›</button>
    </div>
    <div class="actions">
      <button class="pill" id="todayBtn">오늘</button>
      <button class="pill" id="dreamBtn">내 꿈</button>
    </div>
  </header>

  <section class="stage" id="stage" aria-label="이달의 응원 캐릭터">
    <div class="sky" id="sky"></div>
    <span class="tag" id="tag">10월 응원단</span>
    <button class="char-btn" id="charBtn" aria-label="캐릭터를 눌러 응원 받기">
      <span class="shout" id="shout">화이팅!</span>
      <span id="charHost"></span>
      <span class="burst" id="burst"></span>
    </button>
    <div class="say">
      <div class="bubble" id="bubble" aria-live="polite"></div>
      <button class="link-btn" id="askDream" hidden>내 꿈 알려 주기</button>
    </div>
    <div class="stage-foot">
      <button class="pill solid more" id="moreBtn">한 번 더 응원해 줘</button>
      <div class="goal">
        <label for="goal" id="goalLabel">10월 목표</label>
        <input id="goal" type="text" maxlength="60" placeholder="이번 달에 해내고 싶은 한 가지" autocomplete="off">
      </div>
    </div>
  </section>

  <section class="cal" id="cal" aria-label="달력">
    <div class="wk"><span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span></div>
    <div class="grid" id="grid"></div>
  </section>

  <section class="day" aria-label="선택한 날짜">
    <div class="day-head"><strong id="dayTitle">10월 21일 수요일</strong><span class="chip" id="dayHol" hidden></span></div>
    <textarea id="memo" placeholder="이날 할 일이나 기억할 것을 적어 두세요"></textarea>
  </section>

  <p class="foot"><span id="saveState">이 브라우저에 저장돼요</span><br>공휴일은 2026~2027년이 반영돼 있어요. 달력은 좌우로 밀어서 넘길 수 있어요.</p>
</div>

<div class="sheet-wrap" id="sheetWrap" hidden>
  <button class="backdrop" id="backdrop" aria-label="닫기"></button>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <h2 id="sheetTitle">응원단에게 알려 주기</h2>
    <p>적어 둔 꿈은 열두 달 캐릭터가 돌아가며 불러 줘요.</p>
    <div class="field">
      <label for="nameIn">불러 줄 이름</label>
      <input id="nameIn" type="text" maxlength="12" autocomplete="off">
    </div>
    <div class="field">
      <label for="dreamIn">내 꿈</label>
      <textarea id="dreamIn" maxlength="80" placeholder="예: 내 이름으로 된 일로 하루를 채우는 사람"></textarea>
    </div>
    <div class="row">
      <button class="pill" id="cancelBtn">닫기</button>
      <button class="pill solid" id="saveBtn">저장하고 응원 받기</button>
    </div>
    <span class="save-note" id="saveNote"></span>
  </div>
</div>

<script>

    "2027-05-13": "부처님오신날", "2027-06-06": "현충일", "2027-07-17": "제헌절", "2027-07-19": "대체공휴일",

  /* ---------- twelve cheer friends ---------- */

      : `<path d="M98 ${mouthY} Q110 ${mouthY + 22} 122 ${mouthY} Z" fill="${mouthCol}" ${st}/><path d="M104 ${mouthY + 9} Q110 ${mouthY + 4} 116 ${mouthY + 9} Q110 ${mouthY + 15} 104 ${mouthY + 9}Z" fill="#FF8A93"/>`;
    const noseEl = nose ? `<ellipse cx="110" cy="${mouthY - 7}" rx="4.5" ry="3.2" fill="${INK}"/>` : "";
    const eyeEls = eyes.map(([x, y]) => `<ellipse cx="${x}" cy="${y}" rx="5" ry="6.2" fill="${INK}"/><circle cx="${x + 1.8}" cy="${y - 2.4}" r="2" fill="#fff"/>`).join("");
    const cheekY = (c.acc === "beanie" ? 138 : 132);
    const cheeks = c.kind === "frog" ? `<ellipse cx="80" cy="128" rx="8" ry="5" fill="#FF8FA3" opacity=".55"/><ellipse cx="140" cy="128" rx="8" ry="5" fill="#FF8FA3" opacity=".55"/>`
      : `<ellipse cx="78" cy="${cheekY}" rx="8" ry="5" fill="#FF8FA3" opacity=".6"/><ellipse cx="142" cy="${cheekY}" rx="8" ry="5" fill="#FF8FA3" opacity=".6"/>`;
    const arm = (sx, sy, hx, hy) =>
      `<path d="M${sx} ${sy} Q${(sx + hx) / 2 + (hx < 110 ? -4 : 4)} ${(sy + hy) / 2} ${hx} ${hy}" stroke="${INK}" stroke-width="20" fill="none" stroke-linecap="round"/>
       <path d="M${sx} ${sy} Q${(sx + hx) / 2 + (hx < 110 ? -4 : 4)} ${(sy + hy) / 2} ${hx} ${hy}" stroke="${B}" stroke-width="14" fill="none" stroke-linecap="round"/>`;

    return `<svg viewBox="0 0 220 210" role="img" aria-label="${c.sp} ${c.name}" xmlns="http://www.w3.org/2000/svg">
      <defs><clipPath id="${uid}b"><ellipse cx="110" cy="132" rx="56" ry="54"/></clipPath></defs>
      <ellipse class="shadow" cx="110" cy="196" rx="50" ry="7" fill="${INK}"/>
      <g class="bob">
        ${back}
        <g class="armL">${arm(70, 128, 34, 82)}${pompom(30, 76, c.pom)}</g>
        <g class="armR">${arm(150, 128, 186, 82)}${pompom(190, 76, c.pom)}</g>
        <ellipse cx="90" cy="186" rx="14" ry="8" fill="${B}" ${st}/><ellipse cx="130" cy="186" rx="14" ry="8" fill="${B}" ${st}/>
        <ellipse cx="110" cy="132" rx="56" ry="54" fill="${B}" ${st}/>
        ${L ? `<ellipse cx="110" cy="156" rx="32" ry="24" fill="${L}" clip-path="url(#${uid}b)"/>` : ""}
        <ellipse cx="86" cy="98" rx="12" ry="6" transform="rotate(-30 86 98)" fill="#fff" opacity=".45"/>
        ${front}
        ${cheeks}${eyeEls}${noseEl}${mouth}
        ${top}
      </g>
    </svg>`;
  }

  /* ---------- particles ---------- */
  const SHAPES = {
    snow: () => `<svg viewBox="0 0 10 10"><circle cx="5" cy="5" r="4" fill="#fff" stroke="rgba(110,130,180,.4)"/></svg>`,
    heart: () => `<svg viewBox="0 0 10 10"><path d="M5 9 C1 6 0 4 1.5 2.5 C3 1 4.5 1.8 5 3 C5.5 1.8 7 1 8.5 2.5 C10 4 9 6 5 9Z" fill="#FF7D9C"/></svg>`,
    petal: () => `<svg viewBox="0 0 10 10"><ellipse cx="5" cy="5" rx="3" ry="4.6" fill="#FFB3C7"/></svg>`,
    forsythia: () => `<svg viewBox="0 0 10 10"><g fill="#FFCF33"><ellipse cx="5" cy="2.6" rx="1.6" ry="2.6"/><ellipse cx="5" cy="7.4" rx="1.6" ry="2.6"/><ellipse cx="2.6" cy="5" rx="2.6" ry="1.6"/><ellipse cx="7.4" cy="5" rx="2.6" ry="1.6"/></g></svg>`,
    lilac: () => `<svg viewBox="0 0 10 10"><g fill="#C3A0FF"><circle cx="5" cy="2.4" r="2"/><circle cx="7.5" cy="4.3" r="2"/><circle cx="6.5" cy="7.4" r="2"/><circle cx="3.5" cy="7.4" r="2"/><circle cx="2.5" cy="4.3" r="2"/></g><circle cx="5" cy="5.2" r="1.3" fill="#FFF3B0"/></svg>`,
    rain: () => `<svg viewBox="0 0 10 10"><line x1="6" y1="0" x2="4" y2="10" stroke="#5FA9D1" stroke-width="1.3" stroke-linecap="round"/></svg>`,
    sparkle: () => `<svg viewBox="0 0 10 10"><path d="M5 0 L6.2 3.8 L10 5 L6.2 6.2 L5 10 L3.8 6.2 L0 5 L3.8 3.8Z" fill="#FFA928"/></svg>`,
    bubble: () => `<svg viewBox="0 0 10 10"><circle cx="5" cy="5" r="4" fill="rgba(255,255,255,.25)" stroke="#4FA6DD" stroke-width="1"/></svg>`,
    star: () => `<svg viewBox="0 0 10 10"><path d="M5 0 L6.2 3.8 L10 5 L6.2 6.2 L5 10 L3.8 6.2 L0 5 L3.8 3.8Z" fill="#FFD966"/></svg>`,
    leaf: (i) => `<svg viewBox="0 0 40 40"><polygon points="${star(20, 21, 18, 9, 5, 0)}" fill="${i % 2 ? "#F2A33A" : "#E8613A"}"/></svg>`,
    brownleaf: (i) => `<svg viewBox="0 0 10 10"><path d="M5 0 C9 3 9 7 5 10 C1 7 1 3 5 0Z" fill="${i % 2 ? "#B07A3C" : "#8DB255"}"/></svg>`
  };
  function makeSky(fx) {
    const sky = $("sky"); let html = "";
    if (fx === "star") html += `<div class="moon"></div>`;
    const mode = fx === "rain" ? "rain" : fx === "bubble" ? "rise" : (fx === "sparkle" || fx === "star") ? "twinkle" : "fall";
    const n = fx === "rain" ? 20 : 14;
    for (let i = 0; i < n; i++) {
      const left = (i / n) * 100 + Math.random() * (100 / n);
      const sz = fx === "rain" ? 14 : fx === "leaf" ? 13 + Math.random() * 6 : 7 + Math.random() * 7;
      const dur = mode === "rain" ? 1.1 + Math.random() * .7 : mode === "twinkle" ? 1.8 + Math.random() * 2 : 7 + Math.random() * 6;
      const del = -Math.random() * dur;
      let style = `left:${left.toFixed(1)}%;--sz:${sz.toFixed(1)}px;--dur:${dur.toFixed(2)}s;--del:${del.toFixed(2)}s;`;
      if (mode === "twinkle") style += `top:${(5 + Math.random() * 80).toFixed(1)}%;`;
      html += `<span class="p ${mode}" style="${style}">${SHAPES[fx](i)}</span>`;
    }
    sky.innerHTML = html;
  }

  /* ---------- cheer logic ---------- */
  function goalText() { return (state.goals[ym(view.y, view.m)] || "").trim(); }
  function lines() {
    const c = CREW[view.m], d = (state.dream || "").trim(), g = goalText();
    let L = c.lines.filter(t => (d || !t.includes("{d}")) && (g || !t.includes("{g}")));
    if (!d) L = ["{v}, 네 꿈이 뭐야? 알려 주면 매달 내가 크게 불러 줄게!"].concat(L);
    return L.map(t => t.split("{v}").join(voc()).split("{d}").join(d).split("{g}").join(g));
  }
  function showLine(animate) {
    const L = lines(), b = $("bubble");
    b.textContent = L[lineIdx % L.length];
    if (animate) { b.classList.remove("fade"); void b.offsetWidth; b.classList.add("fade"); }
    $("askDream").hidden = !!(state.dream || "").trim();
  }
  function shout(text) {
    const s = $("shout");
    s.textContent = text;
    s.classList.remove("pop"); void s.offsetWidth; s.classList.add("pop");
  }
  function burst() {
    if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    const host = $("burst"), c = CREW[view.m];
    const cols = [c.pom, "#FFD23F", "#FF7D9C", "#7CC4F2", "#8FD46F"];
    let html = "";
    for (let i = 0; i < 14; i++) {
      const a = Math.random() * Math.PI * 2, r = 60 + Math.random() * 60;
      html += `<i style="--c:${cols[i % cols.length]};--dx:${(Math.cos(a) * r).toFixed(0)}px;--dy:${(Math.sin(a) * r - 30).toFixed(0)}px"></i>`;
    }
    host.innerHTML = html;
    setTimeout(() => { host.innerHTML = ""; }, 950);
  }
  function cheer(customShout) {
    lineIdx++; shoutIdx++;
    shout(customShout || SHOUTS[shoutIdx % SHOUTS.length]);
    showLine(true); burst();
    const btn = $("charBtn");
    btn.classList.remove("jump"); void btn.offsetWidth; btn.classList.add("jump");
    clearTimeout(cheer.t); cheer.t = setTimeout(() => btn.classList.remove("jump"), 650);
  }

  /* ---------- render ---------- */
  function renderStage(animate) {
    const c = CREW[view.m];
    document.documentElement.style.setProperty("--h", c.h);
    document.documentElement.style.setProperty("--s", c.s);
    $("tag").textContent = `${view.m + 1}월 응원단 · ${c.sp} ${c.name}`;
    $("charHost").innerHTML = charSVG(c, view.m);
    if (animate) { const s = $("charHost").firstElementChild; s.classList.add("enter"); }
    $("charBtn").setAttribute("aria-label", `응원 받기: ${c.sp} ${c.name}`);
    makeSky(c.fx);
    $("goalLabel").textContent = `${view.m + 1}월 목표`;
    const gi = $("goal"); if (document.activeElement !== gi) gi.value = state.goals[ym(view.y, view.m)] || "";
    lineIdx = 0; shoutIdx = 0;
    shout("화이팅!"); showLine(animate);
  }
  function renderHeader() {
    $("yr").textContent = view.y + "년";
    $("mo").textContent = (view.m + 1) + "월";
  }
  function renderGrid() {
    const g = $("grid"), first = new Date(view.y, view.m, 1).getDay();
    const days = new Date(view.y, view.m + 1, 0).getDate();
    const prevDays = new Date(view.y, view.m, 0).getDate();
    const total = Math.ceil((first + days) / 7) * 7;
    const tk = key(now.getFullYear(), now.getMonth(), now.getDate());
    const sk = key(sel.y, sel.m, sel.d);
    let html = "";
    for (let i = 0; i < total; i++) {
      const dow = i % 7;
      if (i < first || i >= first + days) {
        const n = i < first ? prevDays - first + i + 1 : i - first - days + 1;
        html += `<button class="cell other" tabindex="-1" aria-hidden="true"><span class="num">${n}</span></button>`;
        continue;
      }
      const d = i - first + 1, k = key(view.y, view.m, d), hol = HOLIDAYS[k];
      const cls = ["cell", dow === 0 ? "sun" : "", dow === 6 ? "sat" : "", hol ? "hol" : "", k === tk ? "today" : "", k === sk ? "sel" : ""].join(" ");
      const memo = (state.notes[k] || "").trim();
      const label = `${view.m + 1}월 ${d}일 ${WD[dow]}${hol ? ", " + hol : ""}${memo ? ", 메모 있음" : ""}`;
      html += `<button class="${cls}" data-d="${d}" aria-label="${label}"${k === sk ? ' aria-current="date"' : ""}><span class="num">${d}</span>${hol ? `<span class="hn">${hol}</span>` : ""}${memo ? `<span class="dot"></span>` : ""}</button>`;
    }
    g.innerHTML = html;
  }
  function renderDay() {
    const dow = new Date(sel.y, sel.m, sel.d).getDay(), k = key(sel.y, sel.m, sel.d), hol = HOLIDAYS[k];
    $("dayTitle").textContent = `${sel.m + 1}월 ${sel.d}일 ${WD[dow]}`;
    const hc = $("dayHol"); hc.hidden = !hol; hc.textContent = hol || "";
    const memo = $("memo"); if (document.activeElement !== memo) memo.value = state.notes[k] || "";
  }
  function renderAll(animate) { renderHeader(); renderStage(animate); renderGrid(); renderDay(); }

  function go(delta) {
    let m = view.m + delta, y = view.y;
    if (m < 0) { m = 11; y--; } if (m > 11) { m = 0; y++; }
    view = { y, m };
    sel = (y === now.getFullYear() && m === now.getMonth()) ? { y, m, d: now.getDate() } : { y, m, d: 1 };
    renderAll(true);
  }

  /* ---------- events ---------- */
  $("prev").addEventListener("click", () => go(-1));
  $("next").addEventListener("click", () => go(1));
  $("todayBtn").addEventListener("click", () => {
    view = { y: now.getFullYear(), m: now.getMonth() };
    sel = { y: view.y, m: view.m, d: now.getDate() };
    renderAll(true);
  });
  $("charBtn").addEventListener("click", () => cheer());
  $("moreBtn").addEventListener("click", () => cheer());
  $("grid").addEventListener("click", e => {
    const b = e.target.closest(".cell[data-d]"); if (!b) return;
    sel = { y: view.y, m: view.m, d: +b.dataset.d };
    renderGrid(); renderDay();
  });
  $("memo").addEventListener("input", e => {
    const k = key(sel.y, sel.m, sel.d), v = e.target.value;
    const had = !!(state.notes[k] || "").trim();
    if (v.trim()) state.notes[k] = v; else delete state.notes[k];
    if (had !== !!v.trim()) renderGrid();
    saveSoon();
  });
  $("goal").addEventListener("input", e => {
    const k = ym(view.y, view.m), v = e.target.value;
    if (v.trim()) state.goals[k] = v; else delete state.goals[k];
    saveSoon();
  });
  $("goal").addEventListener("change", () => {
    const L = lines(), idx = L.findIndex(t => goalText() && t.includes(goalText()));
    if (idx >= 0) { lineIdx = idx - 1; cheer("접수 완료!"); } else showLine(true);
  });
  $("goal").addEventListener("keydown", e => { if (e.key === "Enter") e.target.blur(); });

  // swipe months
  let sx = null, sy = null;
  $("cal").addEventListener("touchstart", e => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, { passive: true });
  $("cal").addEventListener("touchend", e => {
    if (sx === null) return;
    const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.4) go(dx < 0 ? 1 : -1);
    sx = sy = null;
  });
  document.addEventListener("keydown", e => {
    if (!$("sheetWrap").hidden) { if (e.key === "Escape") closeSheet(); return; }
    if (e.target.closest("input, textarea")) return;
    if (e.key === "ArrowLeft") go(-1);
    if (e.key === "ArrowRight") go(1);
  });

  // dream sheet
  function openSheet() {
    $("nameIn").value = state.name || "";
    $("dreamIn").value = state.dream || "";
    $("sheetWrap").hidden = false;
    setTimeout(() => $("dreamIn").focus(), 50);
  }
  function closeSheet() { $("sheetWrap").hidden = true; $("dreamBtn").focus(); }
  $("dreamBtn").addEventListener("click", openSheet);
  $("askDream").addEventListener("click", openSheet);
  $("backdrop").addEventListener("click", closeSheet);
  $("cancelBtn").addEventListener("click", closeSheet);
  $("saveBtn").addEventListener("click", () => {
    state.name = $("nameIn").value.trim() || "아로";
    state.dream = $("dreamIn").value.trim();
    saveSoon(); closeSheet();
    lineIdx = 0;
    const L = lines(), idx = state.dream ? L.findIndex(t => t.includes(state.dream)) : 0;
    lineIdx = Math.max(0, idx) - 1;
    cheer(state.dream ? "꿈 접수 완료!" : "화이팅!");
  });

  renderAll(true);
})();
</script>
</body>
</html>
